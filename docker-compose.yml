
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: ingestor-api
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
    env_file:
      - .env
    environment:
      ENV: local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: ingestor-worker
    command: python -m workers.consumer
    env_file:
      - .env
    environment:
      ENV: local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ingestor-db
    environment:
      POSTGRES_DB: ingestor
      POSTGRES_USER: ingestor
      POSTGRES_PASSWORD: ingestor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestor -d ingestor"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ingestor-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
